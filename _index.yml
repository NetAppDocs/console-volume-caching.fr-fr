indexpage:
  title: NetApp Volume Caching
  lead: La mise en cache de volume fournit un volume persistant et inscriptible dans
    un emplacement distant. Vous pouvez utiliser la mise en cache des volumes pour
    accélérer l’accès aux données ou pour décharger le trafic des volumes fortement
    sollicités. Les volumes de cache sont idéaux pour les charges de travail à lecture
    intensive, en particulier lorsque les clients doivent accéder aux mêmes données
    de manière répétée.
